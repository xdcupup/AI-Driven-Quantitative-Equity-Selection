# =============================================================================
# AI 量化数据流水线 — 全局配置
# =============================================================================

# --- 数据源 ---
data_source:
  engine: astock             # 新直连数据层：不使用 AKShare / Tushare
  market_primary: mootdx     # 日K线主源：通达信 TCP
  market_fallback: baidu     # 日K线兜底：百度股市通
  quote_source: tencent      # 估值/换手率/市值/涨跌停：腾讯财经
  eastmoney_usage: unique_only # 东财只用于独有数据，并通过 em_get 限流

# --- A股全市场股票池 ---
stock_pool:
  # 留空 = 全部A股（含北交所）
  # 可选过滤: 按行业 ts_code 列表
  include_exchanges:         # 包含的交易所
    - SZSE                    # 深交所
    - SSE                     # 上交所
    # - BSE                   # 北交所（可选）
  exclude_st:
    enabled: true            # 自动剔除 ST / *ST
  st_history:
    enabled: false           # 新架构首阶段不走 Tushare 名称变更/ST 历史
    full_refresh_only: true  # 默认只在全量刷新时跑，避免每日增量过重
    batch_size: 100
    max_stocks_per_run: null # 留空=全量；调试可限制数量
  exclude_ipo_within_days: 60  # 上市不足 N 天的次新股剔除

# --- 并发采集 ---
concurrency:
  enabled: true              # 启用并发采集
  max_workers: 2             # mootdx/百度行情并发，先保守运行
  batch_size_for_upsert: 100 # 每采集N只股票批量写入一次数据库
fetch:
  market_data:
    daily_kline: true        # 日K线
    adj_factor: false        # 新架构首阶段先保存未复权价格
    daily_basic: true        # 每日基本面指标（PE/PB/换手率等）
  financial_data:
    enabled: false           # 可开启 mootdx finance 最新快照
    batch_size: 100          # 每 N 只股票批量写入一次
    max_stocks_per_run: null # 留空=全量；测试/调试可限制只跑部分股票
    # 默认只在财务季报窗口（1/4/7/10月）自动拉取
  financial_statements:
    enabled: false           # 新浪原始三表：全量任务可开启
    full_refresh_only: true  # 默认只在 full-refresh 时运行，避免每日增量过重
    statement_types:
      - income_statement     # 利润表
      - balance_sheet        # 资产负债表
      - cash_flow            # 现金流量表
    batch_size: 50           # 每 N 个请求结果批量写入一次
    max_stocks_per_run: null # 留空=全量；调试可限制只跑部分股票
  factor_derivation:
    enabled: false           # 从原始三表派生财务因子，可在三表入库后开启
  technical_factors:
    enabled: false           # 从 daily_kline 派生技术/量价因子
    lookback_days: 120       # 至少覆盖 60 日窗口，留出自然日冗余
    batch_size: 100          # 每 N 只股票批量写入一次
    max_stocks_per_run: null # 留空=全量；调试可限制只跑部分股票
  factor_labels:
    enabled: false           # 从 daily_kline 派生未来收益/回撤标签
    lookback_days: 180       # 标签需要未来窗口，通常和技术因子一起批量跑
    horizons: [5, 10, 20]
    drawdown_horizon: 20
    batch_size: 100
    max_stocks_per_run: null
  # 资金流向（可选）
  money_flow:
    enabled: false
  # 交易日历起止
  start_date: "20260101"     # 只跑2026年数据
  end_date: "today"          # "today" = 自动取当天
  stock_concepts:
    enabled: false
    max_stocks: 100
  hot_themes:
    enabled: false
    top_themes: 10
  dragon_tiger:
    enabled: false
    max_stocks: 200
  fund_flow:
    enabled: false
    max_stocks: 200

evaluation:
  factor_ic:
    enabled: false
    lookback_days: 365
    factor_columns:
      - return_20d
      - return_60d
      - volatility_20d
      - ma20_bias
      - ma60_bias
      - max_drawdown_60d
      - volume_ratio_20d
      - liquidity_20d
    label_column: forward_return_20d
    method: spearman

scoring:
  hot_candidate:
    enabled: false           # 生成短线候选评分并写入 hot_candidate_scores
    strategy_name: hot_candidate_v2_stable
    min_pct_chg: 9.0         # 基础候选：当日涨幅 >= 9%
    lookback_days: 10        # 计算开盘溢价、连板高度等需要的回看窗口

# --- 数据存储 ---
storage:
  db_path: "./data/quant.duckdb"      # DuckDB 数据库文件路径
  raw_dir: "./data/raw"               # 原始 CSV/Parquet 暂存
  parquet_compression: zstd           # 压缩算法: snappy | zstd | lz4

# --- 复权策略 ---
adjust:
  method: none              # 采集层主表统一保存未复权价格
  # 策略说明:
  #   hfq - 因子计算用（价格连续，无负值）
  #   qfq - 回测用（贴近真实交易价格）
  #   none - 实盘信号用（+除权日特殊处理）

# --- 清洗参数 ---
cleaning:
  outlier_method: mad        # 离群值检测: mad | zscore | iqr（仅标记，不改写价格）
  mad_threshold: 5.0         # MAD 倍数（默认 5，越大越宽松）
  zscore_threshold: 3.0      # Z-Score 阈值（zscore 模式用）
  iqr_multiplier: 1.5        # IQR 倍数（iqr 模式用）
  max_daily_pct: 15.0        # 单日涨跌幅超过此值标记为异常
  min_trading_days: 20       # 上市少于该交易日数的股票跳过因子计算

# --- 交易日历 ---
trade_calendar:
  sse: true                  # 上交所
  szse: true                 # 深交所
  # 新网关使用腾讯上证指数日K线派生真实交易日；接口失败时回退工作日近似

# --- 质量监控阈值 ---
quality:
  known_missing_fields:
    - adj_factor             # 首阶段未接复权因子源
  alerts:
    missing_data_ratio: 0.05        # 缺失率超过 5% 报警
    extreme_stocks_ratio: 0.02      # 极端值占比超过 2% 报警
    fetch_failure_retries: 3        # 采集失败重试次数
  source_audit:
    enabled: true                   # 主行情 vs 第二数据源轻量抽样对账
    secondary: baidu                # baidu
    sample_size: 10                 # 每次抽样股票数
    lookback_days: 5                # 对比最近 N 天
    tolerance_pct: 1.0              # 收盘价最大差异超过阈值标 warning
  report:
    save_raw: true                  # 保存原始质量报告 JSON
    push_feishu: false              # 是否推送到飞书（通过 Hermes 转发）

# --- 日志 ---
logging:
  level: INFO                # DEBUG | INFO | WARNING | ERROR
  file: "./logs/pipeline.log"
  max_size_mb: 50
  backup_count: 7
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level:<7} | {name}:{function}:{line} | {message}"

backtest:
  enabled: false
  start_date: "2024-01-01"
  lookback_days: 365
  top_n: 50
  bottom_n: 50
  initial_capital: 1000000.0
  max_positions: 20
  position_sizing: equal_weight
  rebalance_frequency: daily
  execution_model: next_open
  slippage_bps: 5.0
  commission_bps: 2.5
  stamp_duty_bps: 10.0
  block_limit_up_buys: true
  limit_up_threshold: 0.095
  block_limit_down_sells: true
  limit_down_threshold: -0.095
  industry_neutral: false
  market_cap_neutral: false
  scan_enabled: false
  decay_enabled: false
  decay_half_life: 5
  attribution_enabled: false
  output_dir: data/backtest
  factor_columns:
    - return_20d
    - return_60d
    - volatility_20d
    - ma20_bias
    - ma60_bias
    - max_drawdown_60d
    - volume_ratio_20d
    - liquidity_20d
  label_column: forward_return_20d

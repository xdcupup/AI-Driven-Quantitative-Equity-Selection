<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alpha Trader — 量化仪表盘</title>
  <meta name="description" content="AI 驱动 A 股量化选股系统">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lightweight-charts@4.2.1/dist/lightweight-charts.standalone.production.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>

<div class="app-layout">

  <!-- ================================================================
       Header
       ================================================================ -->
  <header class="header" role="banner">
    <div class="header-brand">
      <span class="header-brand-mark" aria-hidden="true">α</span>
      Alpha Trader
    </div>
    <nav class="header-nav" aria-label="主导航">
      <button aria-current="page">行情</button>
      <button>因子</button>
      <button>回测</button>
      <button>对账</button>
    </nav>
    <span class="header-meta" id="header-date">加载中…</span>
    <div class="header-actions">
      <button class="btn btn-secondary" onclick="renderAll()">刷新</button>
    </div>
  </header>

  <!-- ================================================================
       Watchlist
       ================================================================ -->
  <aside class="watchlist" aria-label="股票列表">
    <div class="watchlist-header">
      <h2>自选观察</h2>
      <span class="watchlist-header-count" id="watchlist-count">0</span>
    </div>
    <div class="watchlist-search">
      <input id="search-input" type="search" placeholder="搜索代码/名称" aria-label="搜索股票">
    </div>
    <div class="watchlist-items" id="watchlist-items" role="listbox" aria-label="股票列表">
      <!-- rendered by js -->
    </div>
  </aside>

  <!-- ================================================================
       Chart Area
       ================================================================ -->
  <main class="chart-area" aria-label="K线图">
    <div class="chart-toolbar">
      <span class="chart-toolbar-code" id="chart-code">—</span>
      <span class="chart-toolbar-price" id="chart-price">—</span>
      <span class="chart-toolbar-change" id="chart-change">—</span>
      <div class="chart-toolbar-timeframes" role="tablist" aria-label="时间周期">
        <button role="tab" aria-pressed="true">日线</button>
        <button role="tab">周线</button>
        <button role="tab">月线</button>
      </div>
    </div>
    <div class="chart-container" id="chart-container">
      <div class="state-message">加载K线数据…</div>
    </div>
  </main>

  <!-- ================================================================
       Info Panel
       ================================================================ -->
  <aside class="info-panel" aria-label="股票详情">
    <div class="info-panel-section" id="info-overview">
      <h3>行情概览</h3>
      <div class="state-message">加载中…</div>
    </div>
    <div class="info-panel-section" id="info-volume">
      <h3>成交量分布（近10日）</h3>
      <div class="state-message">加载中…</div>
    </div>
    <div class="info-panel-section">
      <h3>系统状态</h3>
      <div class="status-list">
        <div class="status-item"><span class="status-dot online"></span> Pipeline</div>
        <div class="status-item"><span class="status-dot online"></span> 数据源: mootdx + 腾讯</div>
        <div class="status-item"><span class="status-dot online"></span> <span id="status-stocks">—</span></div>
      </div>
    </div>
  </aside>

  <!-- ================================================================
       Status Bar
       ================================================================ -->
  <footer class="status-bar" role="status">
    <span>🟢 运行正常</span>
    <span id="status-stocks">— 只已更新</span>
    <span>📅 <span id="status-date">—</span></span>
  </footer>

</div>

<!-- ================================================================
     Demo Data (fallback when no backend running)
     ================================================================ -->
<script>
window.__DEMO_STOCKS = [
  {"code":"000001.SZ","name":"平安银行","close":10.83,"pct":-1.01,"vol":52731200},
  {"code":"000002.SZ","name":"万科A","close":3.07,"pct":0.00,"vol":112600200},
  {"code":"000006.SZ","name":"深振业A","close":7.73,"pct":-2.52,"vol":13771400},
  {"code":"000007.SZ","name":"全新好","close":13.58,"pct":-5.30,"vol":7259800},
  {"code":"000008.SZ","name":"神州高铁","close":2.50,"pct":-1.57,"vol":12714700},
];

(function() {
  // Generate mock kline from real last price
  var lastClose = 10.83;
  var startDate = new Date('2026-01-05');
  var endDate = new Date('2026-06-17');
  var data = [];
  var weekday = 0;
  for (var d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
    var dow = d.getDay();
    if (dow === 0 || dow === 6) continue;
    weekday++;
    var open = lastClose + (Math.random() - 0.5) * 0.4;
    var close = open + (Math.random() - 0.5) * 0.6;
    var high = Math.max(open, close) + Math.random() * 0.3;
    var low = Math.min(open, close) - Math.random() * 0.3;
    var vol = Math.round(50000000 + Math.random() * 150000000);
    data.push({
      time: d.toISOString().slice(0,10),
      open: Math.round(open * 100) / 100,
      high: Math.round(high * 100) / 100,
      low: Math.round(low * 100) / 100,
      close: Math.round(close * 100) / 100,
      volume: vol,
    });
    lastClose = close;
  }
  window.__DEMO_KLINE = data;
})();
</script>

</body>
</html>
